name: keep-alive

# Streamlit Community Cloud は無停止のアクセスが無いとスリープし、
# 次の利用者が「起こす」ために待たされる。curl では WebSocket セッションが
# 張られず“起きた”ことにならないため、Playwright(Chromium) で実ブラウザとして
# 開き、必要なら起床ボタンを押し、数十秒滞在して休眠タイマーをリセットする。
#
# スケジュールは日本の業務時間帯（平日）のみ。UTC で 2 行に分割:
#   "*/30 0-11 * * 1-5"  → JST 9:00〜20:59（平日）
#   "*/30 22-23 * * 1-5" → JST  7:00〜 8:59（平日）
# 30分間隔。概算: 平日 約28回 × 約2.5分 ≈ 70分/日 × 約21.7日 ≈ 1520分/月
# （private リポの無料枠 2000 分/月に収める。20分間隔だと超過リスクがあるため30分）。

on:
  schedule:
    - cron: "*/30 0-11 * * 1-5"    # JST 9:00-20:59（平日）
    - cron: "*/30 22-23 * * 1-5"   # JST 7:00-8:59（平日）
  workflow_dispatch:               # 手動でも実行できる

# 直前の実行が長引いても重ならないようにする（分を節約）
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright (Chromium)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Wake the Streamlit app
        run: python scripts/keepalive_ping.py
