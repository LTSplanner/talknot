name: roleplay-reminder

# 毎日15:00(JST) 前後に「本日ロープレ未実施の人」へ個人Chat DM（またはWebhook投稿）を送る。
# 送る/送らないは曜日ではなく**各自のカレンダー**で決める（休み・有給・会社休は送らない）。
# 必要な GitHub Secrets:
#   KNOWLEDGE_SHEET_ID  … 評価履歴シートのID（当日実施の判定に使う）
#   KNOWLEDGE_SA_JSON   … 評価履歴シートを読む知識SAの鍵JSON
#   個人DM経路を使う場合（推奨）:
#     CHAT_SA_JSON        … Chatアプリ用SAの鍵JSON（最小権限の専用SAを推奨）
#     CHAT_ADMIN_SUBJECT  … Directory API 用に impersonate する管理者メール
#   もしくはWebhook経路（簡易）:
#     CHAT_WEBHOOK_URL    … 通知先スペースの Incoming Webhook URL
#   休みスキップ（任意・あれば使う）:
#     CALENDAR_SA_JSON    … カレンダー読み取り用DWD SAの鍵JSON（無ければ休み判定はスキップ）
# 未設定でもスクリプトは exit 0 で静かに終わる（Actions を赤くしない方針）。

on:
  schedule:
    # **1時間ごとに起動し、送ってよいかはスクリプト側で判断する。**
    # GitHub の定期実行は遅延が読めず、12:40 JST 指定の実行が翌 0:38 に走って
    # 深夜にDMが届く事故が起きた。cron の時刻に賭けるのをやめ、
    #   - 送信は JST 14:00〜17:00 の実行だけ（core.reminders.is_within_send_window）
    #   - その日すでに送った人には送らない（ReminderLog に記録）
    # という形で時刻を担保する。何時に遅延しても深夜には絶対に届かない。
    - cron: "25 * * * *"
  workflow_dispatch:          # 手動実行も可

concurrency:
  group: roleplay-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send roleplay reminders
        env:
          # リポジトリ直下を import パスに通す（`from services import ...` 用）。
          PYTHONPATH: .
          KNOWLEDGE_SHEET_ID: ${{ secrets.KNOWLEDGE_SHEET_ID }}
          KNOWLEDGE_SA_JSON: ${{ secrets.KNOWLEDGE_SA_JSON }}
          CHAT_SA_JSON: ${{ secrets.CHAT_SA_JSON }}
          CHAT_ADMIN_SUBJECT: ${{ secrets.CHAT_ADMIN_SUBJECT }}
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
          # 休みスキップ（任意）：あれば当日「休み」の人には送らない。無ければ全員に送る。
          CALENDAR_SA_JSON: ${{ secrets.CALENDAR_SA_JSON }}
        # 失敗しても通知を鳴らさない（スクリプト自体も exit 0 方針だが二重で保険）。
        run: python scripts/send_roleplay_reminders.py || true
